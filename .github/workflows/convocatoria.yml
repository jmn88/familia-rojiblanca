# Carga sola la convocatoria del proximo partido.
#
# Cada media hora mira si hay una jornada esperando convocatoria (partido dentro
# de tres dias y plazo aun abierto). Si la hay, busca la noticia en la web del
# Sevilla FC, saca de ella la lista de convocados y la guarda.
#
# Si el club todavia no la ha publicado, no hace nada y se vuelve a mirar en
# media hora. Si el administrador ya la habia cargado a mano, tampoco la toca:
# manda siempre lo que haya puesto una persona.
#
# El once inicial va en su propio proceso (once.yml): son cosas distintas, en
# momentos distintos, y no tienen por que arrastrarse la una a la otra.
#
# Usa el mismo secret que los demas, SUPABASE_DB_URL (la cadena "Session pooler"
# de Supabase). Esta explicado en el README.
#
# Para lanzarlo a mano: pestaña Actions -> Cargar la convocatoria -> Run workflow.

name: Cargar la convocatoria

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: robot-sevilla
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asegurar el cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client)

      - name: Buscar y cargar la convocatoria
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PGCONN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Esta explicado en el README."
            exit 1
          fi

          # ¿a que jornada le toca, y con que plantilla comparo los nombres?
          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -c "select robot_pendiente();" > pendiente.json

          python3 robot/convocatoria.py < pendiente.json > resultado.json
          cat resultado.json

          leer() { python3 -c "import json; d=json.load(open('resultado.json')); print(d.get('$1',''))"; }

          if [ "$(leer ok)" != "True" ]; then
            echo "Sin cargar nada: $(leer motivo)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # La orden se arma en Python, ya escapada: psql no sustituye variables
          # en las ordenes que se le pasan con -c, y eso hacia fallar esto entero.
          python3 robot/orden_sql.py convocatoria < resultado.json > orden.sql
          cat orden.sql
          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -f orden.sql | tee guardado.txt

          {
            echo "## Convocatoria de la jornada $(leer jornada)"
            echo ""
            echo "Fuente: $(leer fuente)"
            echo ""
            echo "Respuesta de la base de datos: \`$(cat guardado.txt)\`"
            echo ""
            echo "Nombres de la noticia que no estan en la plantilla (canteranos, casi siempre):"
            python3 -c "import json; d=json.load(open('resultado.json')); [print('- '+n) for n in d['sueltos']] or print('- ninguno')"
          } >> "$GITHUB_STEP_SUMMARY"
