# Carga sola la convocatoria del proximo partido.
#
# Cada media hora mira si hay una jornada esperando convocatoria (partido dentro
# de tres dias y plazo aun abierto). Si la hay, busca la noticia en la web del
# Sevilla FC, saca de ella la lista de convocados y la guarda.
#
# Si el club todavia no la ha publicado, no hace nada y se vuelve a mirar en
# media hora. Si el administrador ya la habia cargado a mano, tampoco la toca:
# manda siempre lo que haya puesto una persona.
#
# Usa el mismo secret que el otro proceso, SUPABASE_DB_URL (la cadena "Session
# pooler" de Supabase). Esta explicado en el README.
#
# Para lanzarlo a mano: pestaña Actions -> Cargar la convocatoria -> Run workflow.

name: Cargar la convocatoria

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: convocatoria
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client

      - name: Buscar y cargar la convocatoria
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PGCONN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Esta explicado en el README."
            exit 1
          fi

          # ¿a que jornada le toca, y con que plantilla comparo los nombres?
          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -c "select robot_pendiente();" > pendiente.json

          RESULTADO=$(python3 robot/convocatoria.py < pendiente.json)
          echo "$RESULTADO"

          leer() { echo "$RESULTADO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$1',''))"; }

          if [ "$(leer ok)" != "True" ]; then
            echo "Sin cargar nada: $(leer motivo)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          JORNADA=$(leer jornada_id)
          FUENTE=$(leer fuente)
          IDS=$(echo "$RESULTADO" | python3 -c "import json,sys; print('{'+','.join(str(i) for i in json.load(sys.stdin)['ids'])+'}')")

          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A \
               -v jornada="$JORNADA" -v ids="$IDS" -v fuente="$FUENTE" \
               -c "select robot_convocatoria(:'jornada'::int, :'ids'::int[], :'fuente');" \
               | tee guardado.json

          {
            echo "## Convocatoria de la jornada $(leer jornada)"
            echo ""
            echo "Fuente: $FUENTE"
            echo ""
            echo "Respuesta de la base de datos: \`$(cat guardado.json)\`"
            echo ""
            echo "Nombres de la noticia que no estan en la plantilla (canteranos, casi siempre):"
            echo "$RESULTADO" | python3 -c "import json,sys; [print('- '+n) for n in json.load(sys.stdin)['sueltos']] or print('- ninguno')"
          } >> "$GITHUB_STEP_SUMMARY"
