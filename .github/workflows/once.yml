# Deja PROPUESTO el once inicial del Sevilla FC.
#
# Mira cada cinco minutos, pero solo en horas en las que puede haber partido.
# Quien decide si toca o no es la base de datos (robot_pendiente_once): solo
# contesta desde hora y media antes del partido y hasta que la alineacion
# aparece. Fuera de eso esto se va de vacio en unos segundos sin tocar nada.
#
# La banda horaria es cosa aparte, y solo sirve para no llenar el registro de
# ejecuciones inutiles de madrugada: el partido mas temprano es a las 14:00 y el
# mas tardio a las 21:30 (hora de Madrid).
#
# OJO: el cron de GitHub va en UTC y NO sigue el cambio de hora espanol, asi que
# la banda se desplaza sola una hora en invierno:
#
#     10-20 UTC  =  12:00-22:55 en verano  |  11:00-21:55 en invierno
#
# Las dos cubren de sobra lo que hace falta, que es estar mirando durante los 90
# minutos anteriores a cualquier partido (desde las 12:30 para uno de las 14:00,
# desde las 20:00 para uno de las 21:30). Lo que se recorta es la cola de tres
# horas DESPUES del inicio, que solo era una red por si el club publicaba tarde:
# para un partido de las 21:30 se deja de mirar hacia las 22:00 en vez de a las
# 00:30. Si algun dia LaLiga pone un partido fuera de ese horario, hay que tocar
# esta linea.
#
# Si a 45 minutos del partido sigue sin encontrarla, la web lo avisa en Admin
# para que se marque a mano.
#
# NO la publica: el once oficial es lo que reparte los puntos, asi que lo
# confirma el administrador desde Admin ("Usar esta propuesta" y guardar).
#
# Va aparte de la convocatoria a proposito: son cosas distintas y en momentos
# distintos, y asi ninguna arrastra a la otra si falla.
#
# Para lanzarlo a mano: pestaña Actions -> Proponer el once inicial -> Run workflow.

name: Proponer el once inicial

on:
  schedule:
    - cron: '*/5 10-20 * * *'
  workflow_dispatch:

concurrency:
  group: robot-sevilla
  cancel-in-progress: false

jobs:
  proponer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Esto se lanza cada cinco minutos: si psql ya viene en la maquina, no se
      # pierden veinte segundos instalandolo otra vez.
      - name: Asegurar el cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client)

      - name: Buscar el once y dejarlo propuesto
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PGCONN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Esta explicado en el README."
            exit 1
          fi

          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -c "select robot_pendiente_once();" > pendiente.json

          python3 robot/once.py < pendiente.json > resultado.json
          cat resultado.json

          leer() { python3 -c "import json; d=json.load(open('resultado.json')); print(d.get('$1',''))"; }

          if [ "$(leer ok)" != "True" ]; then
            MOTIVO=$(leer motivo)
            echo "Sin proponer nada: $MOTIVO" >> "$GITHUB_STEP_SUMMARY"

            # Si habia un partido esperando el once, se anota el intento, para
            # que en Admin se vea que el robot esta mirando y que ha encontrado.
            if python3 robot/orden_sql.py nota "$MOTIVO" < pendiente.json > nota.sql; then
              cat nota.sql
              psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -f nota.sql
            fi
            exit 0
          fi

          # La orden se arma en Python, ya escapada: psql no sustituye variables
          # en las ordenes que se le pasan con -c, y eso hacia fallar esto entero.
          python3 robot/orden_sql.py once < resultado.json > orden.sql
          cat orden.sql
          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -f orden.sql | tee guardado.txt

          {
            echo "## Once propuesto para la jornada $(leer jornada)"
            echo ""
            echo "Fuente: $(leer fuente)"
            echo ""
            echo "Respuesta de la base de datos: \`$(cat guardado.txt)\`"
            echo ""
            echo "**Falta confirmarlo desde Admin**: hasta entonces no se puntua nada."
            echo ""
            python3 -c "import json; d=json.load(open('resultado.json')); [print('- '+c['nombre']) for c in d['casados']]"
          } >> "$GITHUB_STEP_SUMMARY"
