# Carga el once inicial del Sevilla FC y lo PUBLICA: con el se reparten los
# puntos de la jornada en el acto.
#
# EL CRON AQUI ES SOLO UN DESPERTADOR, no el reloj.
#
# GitHub no cumple lo que se le pide en las tareas programadas: se le pedian
# pasadas cada cinco minutos y lanzaba una cada hora o dos (medido en agosto de
# 2026: huecos reales de 51 a 173 minutos, y uno de 34 horas en el robot de los
# avisos). Con una ventana de 90 minutos, habia jornadas en las que no se
# ejecutaba ni una sola vez a tiempo y el once no se proponia.
#
# Asi que ahora la ejecucion NO se va nada mas mirar: si la base de datos dice
# que hay partido a la vista, robot/once.py se queda despierto mirando cada dos
# minutos hasta que la alineacion aparece (--vigilar). Basta con que GitHub
# arranque esto UNA vez en toda la tarde para cazar el once con precision de dos
# minutos. Los minutos de maquina son gratis e ilimitados en repositorios
# publicos, asi que esperar no cuesta nada.
#
# Por eso la ventana de robot_pendiente_once() empieza tres horas antes del
# partido: cuanto mas ancha, mas facil es que a GitHub le de por arrancarlo
# alguna vez dentro de ella.
#
# La banda horaria solo sirve para no llenar el registro de ejecuciones inutiles
# de madrugada. El cron de GitHub va en UTC y NO sigue el cambio de hora
# espanol, asi que se desplaza sola una hora en invierno:
#
#     8-20 UTC  =  10:00-22:55 en verano  |  9:00-21:55 en invierno
#
# Cubre de sobra lo que hace falta: la ventana del partido mas temprano (14:00
# en Madrid) abre a las 11:00, y la del mas tardio (21:30) a las 18:30.
#
# Si a 45 minutos del partido sigue sin encontrarla, la web lo avisa en Admin
# para que se marque a mano.
#
# Empezo dejando el once solo PROPUESTO, para que lo confirmara el
# administrador; tras cinco jornadas sin fallar, en septiembre de 2026 paso a
# publicarlo el solo. Queda una salvaguarda, que la decide SQL (robot_once):
# si el once leido lleva a alguien fuera de la convocatoria, no se publica, se
# deja propuesto y Admin lo avisa, como antes.
#
# Al terminar se lanza «Resultados por correo» (workflow_run), que escribe a
# cada participante con el once, sus puntos y la imagen del resumen.
#
# Va aparte de la convocatoria a proposito: son cosas distintas y en momentos
# distintos, y asi ninguna arrastra a la otra si falla.
#
# Para lanzarlo a mano: pestaña Actions -> Cargar el once inicial -> Run workflow.

name: Cargar el once inicial

on:
  schedule:
    - cron: '*/15 8-20 * * *'
  workflow_dispatch:

# Grupo PROPIO, no el de los otros robots: como esta ejecucion puede quedarse
# horas despierta, si compartiera grupo dejaria a la convocatoria y al horario
# esperando detras (y GitHub cancela lo que se queda en cola).
concurrency:
  group: robot-once
  cancel-in-progress: false

jobs:
  proponer:
    runs-on: ubuntu-latest
    # se queda esperando al once; el tope de dentro son 5 horas
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # Esto se lanza cada cinco minutos: si psql ya viene en la maquina, no se
      # pierden veinte segundos instalandolo otra vez.
      - name: Asegurar el cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client)

      - name: Buscar el once y publicarlo
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PGCONN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Esta explicado en el README."
            exit 1
          fi

          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -c "select robot_pendiente_once();" > pendiente.json

          # --vigilar: no se va nada mas mirar, se queda esperando al once.
          python3 robot/once.py --vigilar < pendiente.json > resultado.json
          cat resultado.json

          leer() { python3 -c "import json; d=json.load(open('resultado.json')); print(d.get('$1',''))"; }

          if [ "$(leer ok)" != "True" ]; then
            MOTIVO=$(leer motivo)
            echo "Sin publicar nada: $MOTIVO" >> "$GITHUB_STEP_SUMMARY"

            # Si habia un partido esperando el once, se anota el intento, para
            # que en Admin se vea que el robot esta mirando y que ha encontrado.
            if python3 robot/orden_sql.py nota "$MOTIVO" < pendiente.json > nota.sql; then
              cat nota.sql
              psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -f nota.sql
            fi
            exit 0
          fi

          # La orden se arma en Python, ya escapada: psql no sustituye variables
          # en las ordenes que se le pasan con -c, y eso hacia fallar esto entero.
          python3 robot/orden_sql.py once < resultado.json > orden.sql
          cat orden.sql
          psql "$PGCONN" -v ON_ERROR_STOP=1 -t -A -f orden.sql | tee guardado.txt

          # La base de datos dice si lo ha publicado o si lo ha dejado propuesto
          # (solo pasa si alguien del once no estaba en la convocatoria).
          bd() { python3 -c "import json; d=json.load(open('guardado.txt')); print(d.get('$1',''))" 2>/dev/null || echo ""; }

          {
            if [ "$(bd publicado)" = "True" ]; then
              echo "## Once publicado para la jornada $(leer jornada)"
              echo ""
              echo "Ya estan repartidos los puntos. El correo de resultados sale en cuanto se cierre el plazo."
            elif [ "$(bd propuesto)" = "True" ]; then
              echo "## Once PROPUESTO para la jornada $(leer jornada), sin publicar"
              echo ""
              echo "Alguien del once no esta en la convocatoria ($(bd fuera)): **hay que resolverlo desde Admin** (corregir la convocatoria o marcar el once a mano). Hasta entonces no se puntua nada."
            else
              echo "## La base de datos no ha guardado el once de la jornada $(leer jornada)"
              echo ""
              echo "Motivo: $(bd error)"
            fi
            echo ""
            echo "Fuente: $(leer fuente)"
            echo ""
            echo "Respuesta de la base de datos: \`$(cat guardado.txt)\`"
            echo ""
            python3 -c "import json; d=json.load(open('resultado.json')); [print('- '+c['nombre']) for c in d['casados']]"
          } >> "$GITHUB_STEP_SUMMARY"
